name: Build fogos BakaSU UAPI5

on:
  push:
    branches:
      - resukisu-uapi5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Aya kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential git python3 rsync \
            libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Fetch exact Android Clang 12 toolchain
        run: |
          git clone --depth=1 \
            https://github.com/anrui2032/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "$RUNNER_TEMP/clang-r416183b"
          "$RUNNER_TEMP/clang-r416183b/bin/clang" --version

      - name: Overlay BakaSU UAPI 5 at Aya integration path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf drivers/staging/sukisu
          git clone https://github.com/Baka-SU/BakaSU.git drivers/staging/BakaSU
          git -C drivers/staging/BakaSU checkout f6cb7e70c10ebde149f3121ae68b945514fd0801
          ln -s BakaSU/kernel drivers/staging/sukisu

          echo "BakaSU commit: $(git -C drivers/staging/BakaSU rev-parse HEAD)"
          grep -n "KERNEL_SU_UAPI_VERSION" drivers/staging/sukisu/uapi/supercall.h
          test "$(sed -n 's/.*KERNEL_SU_UAPI_VERSION = \([0-9][0-9]*\).*/\1/p' drivers/staging/sukisu/uapi/supercall.h)" = "5"

      - name: Configure fogos kernel
        shell: bash
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/clang-r416183b/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          rm -rf out
          mkdir -p out

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            vendor/holi-qgki_defconfig

          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/ext_config/lineage_moto-holi.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config \
            arch/arm64/configs/ksu.config

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo "==== KernelSU config ===="
          grep -E '^CONFIG_KSU|^# CONFIG_KSU' out/.config || true

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' out/.config

      - name: Build Image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/clang-r416183b/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            Image Image.gz 2>&1 | tee build.log

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image | tee Image.sha256

      - name: Prepare artifact
        if: always()
        run: |
          mkdir -p artifact
          cp -f out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp -f out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp -f out/.config artifact/fogos.config 2>/dev/null || true
          cp -f build.log artifact/ 2>/dev/null || true
          cp -f Image.sha256 artifact/ 2>/dev/null || true
          printf '%s\n' 'Aya base branch: seventeen' > artifact/BUILD_INFO.txt
          printf '%s\n' 'BakaSU commit: f6cb7e70c10ebde149f3121ae68b945514fd0801' >> artifact/BUILD_INFO.txt
          printf '%s\n' 'Target: moto g34 5G (fogos), kernel 5.4, built-in Manual Hook, UAPI 5' >> artifact/BUILD_INFO.txt

      - name: Upload kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fogos-Aya-BakaSU-UAPI5
          path: artifact/
          if-no-files-found: error
          retention-days: 14
